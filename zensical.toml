[project]
site_name = "myfy"
site_description = "Opinionated Python framework with modularity, ergonomics, and power"
site_url = "https://myfy.dev"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/copy-markdown.js"]

# Repository information
# Note: repo_url and repo_name may need to be configured differently in Zensical
# Check Zensical docs for repository integration settings

# Copyright (update year as needed)
# copyright = "&copy; 2025 myfy"

[project.theme]
variant = "modern"
logo = "images/myfy.png"
favicon = "images/myfy.png"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "green"
accent = "light green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "green"
accent = "light green"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.extra]
# Social links and other custom data
# These may be used by templates
github_repo = "https://github.com/psincraian/myfy"

[[project.nav]]
Home = "getting-started/installation.md"

[[project.nav]]
"Getting Started" = [
  { Installation = "getting-started/installation.md" },
  { Tutorial = "getting-started/tutorial.md" },
]

[[project.nav]]
Reference = "reference.md"

[[project.nav]]
Modules = [
  { Core = "modules/core.md" },
  { Web = "modules/web.md" },
  { Data = "modules/data.md" },
  { CLI = "modules/cli.md" },
  { Frontend = "modules/frontend.md" },
]

[[project.nav]]
"Core Concepts" = [
  { "Dependency Injection" = "core-concepts/dependency-injection.md" },
  { Modules = "core-concepts/modules.md" },
  { Configuration = "core-concepts/configuration.md" },
  { Lifecycle = "core-concepts/lifecycle.md" },
]

[[project.nav]]
Deployment = "deployment.md"

[[project.nav]]
ADR = "adr/"

[[project.nav]]
Contributing = "contributing.md"
