[project]
name = "myfy-workspace"
version = "0.1.0"
description = "myfy framework workspace"
requires-python = ">=3.12"
dependencies = [
    "myfy-cli",
    "myfy-frontend",
]

[tool.uv.workspace]
members = [
  "packages/myfy-core",
  "packages/myfy-web",
  "packages/myfy-cli",
  "packages/myfy-frontend",
  "packages/myfy",
]

[tool.uv.sources]
myfy-core = { workspace = true }
myfy-web = { workspace = true }
myfy = { workspace = true }
myfy-frontend = { workspace = true }
myfy-cli = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "ty>=0.0.1a24",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.0.0",
    "commitizen>=4.0.0",
    "httpx>=0.28.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.7.0",
]

[tool.ruff]
# Line length
line-length = 100
target-version = "py312"

# Exclude auto-generated files
extend-exclude = ["_myfy_server.py"]

[tool.ruff.lint]
# Enable comprehensive linting rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modernize Python code)
    "YTT",    # flake8-2020
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EXE",    # flake8-executable
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "PERF",   # perflint
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules that may be too strict for this project
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches
    "PLR2004", # Magic value in comparison
    "N818",    # Exception name should end in Error
    "A003",    # Class attribute shadows Python builtin
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Allow unused imports in __init__.py files
"__init__.py" = ["F401"]
# Test files can have:
# - Imports not at top level (PLC0415) - common in fixtures and test methods
# - Unused arguments (ARG001, ARG002) - test handlers testing signature analysis
# - Nested with statements (SIM117) - clearer in tests
# - Broad exception catches (B017, PT011) - testing that errors are raised
# - Loop variable binding (B023) - intentional in parametric tests
# - Regex metacharacters (RUF043) - test match strings
"tests/*" = ["PLC0415", "ARG001", "ARG002", "SIM117", "B017", "PT011", "B023", "RUF043"]
"*/tests/*" = ["PLC0415", "ARG001", "ARG002", "SIM117", "B017", "PT011", "B023", "RUF043"]

[tool.ruff.lint.isort]
# Configure import sorting
known-first-party = ["myfy", "myfy_cli"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# Use double quotes by default
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.environment]
# Type checking configuration
python-version = "3.12"

[tool.ty.rules]
# Ignore unresolved-import as ty has issues with workspace packages
# Keep other type checking rules enabled
unresolved-import = "ignore"

[tool.pytest.ini_options]
# Pytest configuration
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
# Coverage configuration
source = ["packages/*/myfy*", "packages/*/myfy_cli"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/stubs/*",
    "*/.venv/*",
    "*/examples/*",
]
branch = true
parallel = true

[tool.coverage.report]
# Coverage reporting
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
