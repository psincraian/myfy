[project]
name = "myfy-tasks"
version = "0.1.0"
description = "Asynchronous task processing module for myfy framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "myfy-core~=0.1.2",
    "myfy-data~=0.1.2",
]

[project.entry-points."myfy.modules"]
tasks = "myfy.tasks:tasks_module"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myfy"]
