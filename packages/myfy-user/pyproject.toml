[project]
name = "myfy-user"
version = "0.1.2"
description = "User management module for myfy framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "myfy-core~=0.1.2",
    "myfy-web~=0.1.2",
    "myfy-data~=0.1.2",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.1.0",
]

[project.optional-dependencies]
bcrypt = ["bcrypt>=4.0.0"]

[project.entry-points."myfy.modules"]
user = "myfy.user:user_module"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myfy"]
