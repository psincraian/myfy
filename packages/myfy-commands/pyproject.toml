[project]
name = "myfy-commands"
version = "0.1.0"
description = "CLI commands module for myfy framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "myfy-core~=0.1.2",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.entry-points."myfy.modules"]
commands = "myfy.commands:cli_module"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myfy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "ARG", "PTH", "PL"]
ignore = ["PLR0913"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
