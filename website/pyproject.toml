[project]
name = "myfy-website"
version = "0.1.0"
description = "Official landing page and example application for the myfy framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Local myfy framework packages (workspace dependencies)
    "myfy-core",
    "myfy-web",
    "myfy-frontend",
    "myfy-cli",

    # Website-specific dependencies
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.5",
    "email-validator>=2.0.0",
    "slowapi>=0.1.9",
    "itsdangerous>=2.1.0",
    "captcha>=0.6.0",
]

[project.optional-dependencies]
production = [
    "gunicorn>=21.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["website"]
