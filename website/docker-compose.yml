services:
  db:
    image: postgres:16-alpine
    container_name: myfy_postgres
    environment:
      POSTGRES_USER: myfy
      POSTGRES_PASSWORD: myfy_dev
      POSTGRES_DB: myfy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
