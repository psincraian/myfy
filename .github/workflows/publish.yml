name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty for auto alpha version)'
        required: false
        type: string

jobs:
  # Run all CI checks first
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-publish:
    name: Build and Publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI trusted publishing
      contents: write  # Required for git operations

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for version calculation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Calculate version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version: $VERSION"
          else
            # Auto-generate alpha version based on commit count
            TOTAL_COMMITS=$(git rev-list --count HEAD)
            # Extract version from [project] section, first match only
            CURRENT_VERSION=$(grep -m 1 -A 5 '^\[project\]' pyproject.toml | grep 'version = ' | sed 's/version = "\(.*\)"/\1/')
            BASE_VERSION=$(echo $CURRENT_VERSION | sed 's/a.*//')
            VERSION="${BASE_VERSION}a${TOTAL_COMMITS}"
            echo "Auto-generated alpha version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Calculated version: $VERSION"

      - name: Update versions in all files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating to version: $VERSION"

          # Use Python to safely update TOML files
          python3 << 'PYTHON_SCRIPT'
          import re
          import sys

          version = "${{ steps.version.outputs.version }}"
          base_version = version.split('a')[0] if 'a' in version else version.split('b')[0] if 'b' in version else version.split('rc')[0] if 'rc' in version else version

          # Update pyproject.toml files
          toml_files = [
              'pyproject.toml',
              'packages/myfy-core/pyproject.toml',
              'packages/myfy-web/pyproject.toml',
              'packages/myfy-cli/pyproject.toml',
              'packages/myfy-frontend/pyproject.toml',
              'packages/myfy/pyproject.toml'
          ]

          for file in toml_files:
              with open(file, 'r') as f:
                  content = f.read()

              # Replace version in [project] section only
              content = re.sub(
                  r'(\[project\][^\[]*\nname = [^\n]+\n)version = "[^"]*"',
                  r'\1version = "' + version + '"',
                  content,
                  count=1
              )

              with open(file, 'w') as f:
                  f.write(content)

          # Update version.py files
          version_files = [
              'packages/myfy-core/myfy/core/version.py',
              'packages/myfy-web/myfy/web/version.py',
              'packages/myfy-cli/myfy_cli/version.py',
              'packages/myfy-frontend/myfy/frontend/version.py',
              'packages/myfy/myfy/version.py'
          ]

          for file in version_files:
              with open(file, 'r') as f:
                  content = f.read()
              content = re.sub(r'__version__ = "[^"]*"', f'__version__ = "{version}"', content)
              with open(file, 'w') as f:
                  f.write(content)

          # Update dependency constraints in pyproject.toml files
          # For alpha/beta/rc versions, use exact version (==)
          # For stable versions, use compatible release (~=)
          dep_files = [
              'packages/myfy-web/pyproject.toml',
              'packages/myfy-cli/pyproject.toml',
              'packages/myfy-frontend/pyproject.toml',
              'packages/myfy/pyproject.toml'
          ]

          # Determine constraint operator based on version type
          is_prerelease = 'a' in version or 'b' in version or 'rc' in version
          if is_prerelease:
              # For pre-releases, use exact version match
              constraint = f'=={version}'
          else:
              # For stable releases, use compatible release
              constraint = f'~={base_version}'

          for file in dep_files:
              with open(file, 'r') as f:
                  content = f.read()

              content = re.sub(r'myfy-core[~=]=?[0-9a-z.]+', f'myfy-core{constraint}', content)
              content = re.sub(r'myfy-web[~=]=?[0-9a-z.]+', f'myfy-web{constraint}', content)
              content = re.sub(r'myfy-cli[~=]=?[0-9a-z.]+', f'myfy-cli{constraint}', content)

              with open(file, 'w') as f:
                  f.write(content)

          print(f"Version updated to {version} in all files")
          PYTHON_SCRIPT

          echo "Version updated to $VERSION in all files"

      - name: Build packages
        run: |
          # Build in dependency order using --package flag
          echo "Building myfy-core..."
          uv build --package myfy-core --out-dir packages/myfy-core/dist

          echo "Building myfy-web..."
          uv build --package myfy-web --out-dir packages/myfy-web/dist

          echo "Building myfy-cli..."
          uv build --package myfy-cli --out-dir packages/myfy-cli/dist

          echo "Building myfy-frontend..."
          uv build --package myfy-frontend --out-dir packages/myfy-frontend/dist

          echo "Building myfy meta-package..."
          uv build --package myfy --out-dir packages/myfy/dist

          echo "All packages built successfully"

      - name: List built packages
        run: |
          echo "myfy-core:"
          ls -lh packages/myfy-core/dist/
          tar -tzf packages/myfy-core/dist/*.tar.gz | head -20

          echo -e "\nmyfy-web:"
          ls -lh packages/myfy-web/dist/

          echo -e "\nmyfy-cli:"
          ls -lh packages/myfy-cli/dist/

          echo -e "\nmyfy-frontend:"
          ls -lh packages/myfy-frontend/dist/

          echo -e "\nmyfy:"
          ls -lh packages/myfy/dist/

      - name: Publish myfy-core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/myfy-core/dist/
          verbose: true

      - name: Publish myfy-web to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/myfy-web/dist/
          verbose: true

      - name: Publish myfy-cli to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/myfy-cli/dist/
          verbose: true

      - name: Publish myfy-frontend to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/myfy-frontend/dist/
          verbose: true

      - name: Publish myfy to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/myfy/dist/
          verbose: true

  validate-install:
    name: Validate Installation on Python ${{ matrix.python-version }}
    needs: build-and-publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for PyPI propagation
        run: sleep 30

      - name: Install and test myfy-core
        run: |
          pip install myfy-core --no-cache-dir
          python -c "import myfy.core; print(f'myfy-core version: {myfy.core.__version__}')"

      - name: Install and test myfy-web
        run: |
          pip install myfy-web --no-cache-dir
          python -c "import myfy.web; print(f'myfy-web version: {myfy.web.__version__}')"

      - name: Install and test myfy-cli
        run: |
          pip install myfy-cli --no-cache-dir
          python -c "import myfy_cli; print(f'myfy-cli version: {myfy_cli.__version__}')"
          myfy --help

      - name: Install and test myfy-frontend
        run: |
          pip install myfy-frontend --no-cache-dir
          python -c "import myfy.frontend; print(f'myfy-frontend version: {myfy.frontend.__version__}')"

      - name: Install and test myfy meta-package
        run: |
          pip install myfy[all] --no-cache-dir --upgrade
          python -c "import myfy; print(f'myfy version: {myfy.__version__}')"
