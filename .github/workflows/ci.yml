name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Ruff linter
        run: uv run ruff check packages/ examples/

      - name: Check Ruff formatting
        run: uv run ruff format --check packages/ examples/

  typecheck:
    name: Type Check with ty
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ty type checker
        run: uv run ty check packages/ --exclude '**/stubs/**'

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          # Run tests for each package individually with coverage
          echo "Running myfy-core tests..."
          cd packages/myfy-core && uv run pytest tests/ -v --cov=myfy.core --cov-report=xml:../../coverage-core.xml --cov-report=term && cd ../..

          echo "Running myfy-web tests..."
          cd packages/myfy-web && uv run pytest tests/ -v --cov=myfy.web --cov-report=xml:../../coverage-web.xml --cov-report=term && cd ../..

          echo "Running myfy-frontend tests..."
          cd packages/myfy-frontend && uv run pytest tests/ -v --cov=myfy.frontend --cov-report=xml:../../coverage-frontend.xml --cov-report=term && cd ../..

          echo "Running myfy-cli tests..."
          cd packages/myfy-cli && uv run pytest tests/ -v --cov=myfy_cli --cov-report=xml:../../coverage-cli.xml --cov-report=term && cd ../..

          echo "Running integration tests..."
          uv run pytest tests/integration/ -v --cov=myfy --cov-report=xml:coverage-integration.xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage-*.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
