name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual deployment

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-website

jobs:
  test:
    name: Test Website
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: myfy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: uv sync --all-extras

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./website/package-lock.json

    - name: Install frontend dependencies and build
      working-directory: ./website
      run: |
        npm ci
        npm run build

    - name: Run tests and linting in parallel
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/myfy_test
        SECURITY_SECRET_KEY: test-secret-key-for-ci
        SECURITY_HTTPS_ONLY: "false"
        SECURITY_ALLOWED_HOSTS: localhost,127.0.0.1
        MYFY_FRONTEND_ENVIRONMENT: test
      run: |
        # Run linting and type checking in parallel
        uv run ruff check website/ &
        uv run ruff format --check website/ &
        uv run ty check website/ &
        wait

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./website/Dockerfile
        # Only build for amd64 to speed up builds (most cloud providers use amd64)
        platforms: linux/amd64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: |
          type=gha
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
        cache-to: |
          type=gha,mode=max
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1

  deploy:
    name: Deploy to Coolify
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Coolify Deployment
      run: |
        curl -X POST "https://app.coolify.io/api/v1/deploy?uuid=${{ secrets.COOLIFY_WEBSITE_UUID }}&force=false" \
          -H "Authorization: Bearer ${{ secrets.COOLIFY }}" \
          -H "Content-Type: application/json"

    - name: Deployment triggered
      run: echo "Deployment webhook sent to Coolify. Check Coolify dashboard for deployment status."
